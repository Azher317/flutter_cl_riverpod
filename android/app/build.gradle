plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

// Release signing. Each app keeps its own android/key.properties (never
// committed); android/key.properties.example shows the four fields.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader("UTF-8") { reader ->
        keystoreProperties.load(reader)
    }
}

// API keys for the manifest (maps and the like). Each key in
// android/secrets.properties (never committed) becomes a manifest
// placeholder: MAPS_API_KEY=... -> ${MAPS_API_KEY} in AndroidManifest.xml.
def secretProperties = new Properties()
def secretPropertiesFile = rootProject.file("secrets.properties")
if (secretPropertiesFile.exists()) {
    secretPropertiesFile.withReader("UTF-8") { reader ->
        secretProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

android {
    namespace = "com.example.app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.example.app"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        manifestPlaceholders += secretProperties.collectEntries { k, v -> [(k): v] }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }
}

// A release build without android/key.properties stops here instead of
// signing with the debug key, which the stores reject.
gradle.taskGraph.whenReady { graph ->
    def buildsRelease = graph.allTasks.any { it.name.toLowerCase().contains("release") }
    if (buildsRelease && !keystorePropertiesFile.exists()) {
        throw new GradleException(
            "android/key.properties is missing. Copy android/key.properties.example, " +
            "fill it with this app's upload key, then build again.")
    }
}

flutter {
    source = "../.."
}
