name: CI

# One run per change: pull requests (any branch) and the merge into main.
# A push to a branch with an open PR is already covered by the PR run.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same PR cancels the run still going for the old one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: bin/check_arch.sh
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: dart run custom_lint
      - run: flutter test
