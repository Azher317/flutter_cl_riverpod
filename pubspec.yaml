name: app
description: A new Flutter project.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

executables:
  gen_assets: gen_assets

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  intl: ^0.20.2

  # Fonts And Icons
  cupertino_icons: ^1.0.8

  # Database And Cache
  shared_preferences: ^2.0.15
  flutter_secure_storage: ^10.3.1


  # State Management
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0
  hooks_riverpod: ^3.0.0
  flutter_hooks: ^0.21.2

  # Models
  freezed_annotation: ^3.0.0
  json_annotation: ^4.8.0

  # Routing
  go_router: ^16.0.0

  #client and consumer
  dio: ^5.9.0


  # UI
  flutter_svg: ^2.0.2
  skeletonizer: ^2.1.3

  # Logging
  talker_flutter: ^5.1.17
  talker_dio_logger: ^5.1.17
  talker_riverpod_logger: ^5.1.17

  # Utils
  form_validator: ^2.1.1
  infinite_scroll_pagination: ^4.0.0
  image_picker: ^1.0.4
  image_cropper: ^9.0.0
  url_launcher: ^6.1.10
  cached_network_image: ^3.2.3
  timeago: ^3.4.0
  country_code_picker: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  custom_lint:
  riverpod_lint: '>=3.0.0 <3.1.0'
  build_runner: ^2.13.1
  freezed: ^3.0.4
  json_serializable: ^6.5.4
  riverpod_generator: ^3.0.0
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.1.0

dependency_overrides:
  # All three are required: talker_flutter and talker_dio_logger each depend on
  # `talker: ^5.1.17` from pub.dev rather than on their sibling in the fork, so
  # without the `talker` override the unpatched core is pulled in silently.
  # The fork keeps version 5.1.17, so `pub get` output looks identical either
  # way — verify with `grep -A4 '^  talker:' pubspec.lock` (must show the git url).
  talker:
    git:
      url: https://github.com/Azher317/talker.git
      ref: v1.2-patched
      path: packages/talker
  talker_flutter:
    git:
      url: https://github.com/Azher317/talker.git
      ref: v1.2-patched
      path: packages/talker_flutter
  talker_dio_logger:
    git:
      url: https://github.com/Azher317/talker.git
      ref: v1.2-patched
      path: packages/talker_dio_logger

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/svg/
    - assets/images/png/
    # Placeholder photo for the preview home screen — remove with it.
    - assets/images/jpeg/
  # PLACEHOLDER FONTS — template defaults, not brand fonts. Two families per
  # script: a display face and a body face. Swap these (and the constants in
  # lib/core/theme/app_fonts.dart, which must match these `family:` keys
  # character-for-character) when starting an actual app.
  fonts:
    # ── Latin ────────────────────────────────────────────────────────────
    - family: PlayfairDisplay # display / headline / title
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
    - family: WorkSans # body / label
      fonts:
        - asset: assets/fonts/WorkSans-Regular.ttf
        - asset: assets/fonts/WorkSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/WorkSans-SemiBold.ttf
          weight: 600
    # ── Arabic ───────────────────────────────────────────────────────────
    - family: ArefRuqaa # display / headline / title
      fonts:
        - asset: assets/fonts/ArefRuqaa-Regular.ttf
        - asset: assets/fonts/ArefRuqaa-Bold.ttf
          weight: 700
    - family: Tajawal # body / label
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
