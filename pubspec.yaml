name: app
description: A new Flutter project.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

executables:
  gen_assets: gen_assets

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  intl: ^0.20.2

  # Fonts And Icons
  cupertino_icons: ^1.0.8

  # Database And Cache
  shared_preferences: ^2.0.15

  # State Management
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0
  riverpod: ^3.0.0
  hooks_riverpod: ^3.0.0
  flutter_hooks: ^0.21.2

  # Models
  freezed_annotation: ^3.0.0
  json_annotation: ^4.8.0
  retrofit: 4.7.2

  # Routing
  go_router: ^16.0.0
  dio: ^5.9.0

  # UI
  flutter_svg: ^2.0.2
  vector_graphics: ^1.2.2
  skeletonizer: ^2.1.3

  # Animations
  animated_text_kit: ^4.2.2

  # Logging
  talker_flutter: ^5.1.17
  talker_dio_logger: ^5.1.17
  talker_riverpod_logger: ^5.1.17

  # Utils
  gap: ^3.0.0
  form_validator: ^2.1.1
  since_date: ^0.0.2
  infinite_scroll_pagination: ^4.0.0
  image_picker: ^1.0.4
  image_cropper: ^9.0.0
  url_launcher: ^6.1.10
  cached_network_image: ^3.2.3
  timeago: ^3.4.0
  country_code_picker: ^3.0.0
  path_provider: 2.1.5
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  custom_lint:
  riverpod_lint: ^3.0.0
  build_runner: ^2.13.1
  freezed: ^3.0.4
  json_serializable: ^6.5.4
  riverpod_generator: ^3.0.0
  retrofit_generator: any
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.1.0

dependency_overrides:
  # All three are required: talker_flutter and talker_dio_logger each depend on
  # `talker: ^5.1.17` from pub.dev rather than on their sibling in the fork, so
  # without the `talker` override the unpatched core is pulled in silently.
  # The fork keeps version 5.1.17, so `pub get` output looks identical either
  # way — verify with `flutter pub deps -s list | grep -i talker` (must say git).
  talker:
    git:
      url: https://github.com/Azher317/talker.git
      ref: v1.2-patched
      path: packages/talker
  talker_flutter:
    git:
      url: https://github.com/Azher317/talker.git
      ref: v1.2-patched
      path: packages/talker_flutter
  talker_dio_logger:
    git:
      url: https://github.com/Azher317/talker.git
      ref: v1.2-patched
      path: packages/talker_dio_logger

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/svg/
    - assets/images/png/
  fonts:
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
